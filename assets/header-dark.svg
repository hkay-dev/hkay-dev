<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="Harsha Kotcherlakota. Human by design. Practical by purpose.">
  <defs>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <clipPath id="typed">
      <rect x="48" y="80" height="48" width="0">
        <animate attributeName="width" begin="0.6s" dur="1.4s" fill="freeze" calcMode="discrete"
          values="0;24;48;72;96;120;144;168;192;216;240;264;288;312;336;360;384;408;432;456;480"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #0d1117; stroke: #30363d; }
    .dim { fill: #7d8590; }
    .fg { fill: #e6edf3; }
    .path { fill: #58a6ff; }
    .dir { fill: #3fb950; }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="839" height="239" rx="12"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text class="dim" x="420" y="26" font-size="12" text-anchor="middle">hkay-dev: ~</text>

  <text x="48" y="66" font-size="15"><tspan class="path">~</tspan><tspan class="dim"> $ </tspan><tspan class="fg">whoami</tspan></text>

  <g clip-path="url(#typed)">
    <text class="fg" x="48" y="116" font-size="40" font-weight="700" textLength="480" lengthAdjust="spacingAndGlyphs">Harsha Kotcherlakota</text>
  </g>
  <rect x="48" y="88" width="14" height="34" fill="url(#glow)">
    <animate attributeName="x" begin="0.6s" dur="1.4s" fill="freeze" calcMode="discrete"
      values="48;72;96;120;144;168;192;216;240;264;288;312;336;360;384;408;432;456;480;504;534"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="152" font-size="17" opacity="0">
    <tspan class="fg">Human by design. </tspan><tspan fill="url(#glow)" font-weight="700">Practical by purpose.</tspan>
    <animate attributeName="opacity" begin="2.2s" dur="0.6s" fill="freeze" from="0" to="1"/>
  </text>

  <text x="48" y="192" font-size="15" opacity="0"><tspan class="path">~</tspan><tspan class="dim"> $ </tspan><tspan class="fg">ls ~/open-source</tspan>
    <animate attributeName="opacity" begin="3s" dur="0.3s" fill="freeze" from="0" to="1"/>
  </text>
  <text x="48" y="218" font-size="15">
    <tspan class="dir" fill-opacity="0">finch/<animate attributeName="fill-opacity" begin="3.5s" dur="0.2s" fill="freeze" from="0" to="1"/></tspan>
    <tspan class="dir" dx="12" fill-opacity="0">zag/<animate attributeName="fill-opacity" begin="3.7s" dur="0.2s" fill="freeze" from="0" to="1"/></tspan>
    <tspan class="dir" dx="12" fill-opacity="0">fanbar/<animate attributeName="fill-opacity" begin="3.9s" dur="0.2s" fill="freeze" from="0" to="1"/></tspan>
    <tspan class="dir" dx="12" fill-opacity="0">closeup/<animate attributeName="fill-opacity" begin="4.1s" dur="0.2s" fill="freeze" from="0" to="1"/></tspan>
    <tspan class="dir" dx="12" fill-opacity="0">ohmystash/<animate attributeName="fill-opacity" begin="4.3s" dur="0.2s" fill="freeze" from="0" to="1"/></tspan>
    <tspan class="dim" dx="12" fill-opacity="0">...and lots more on the way<animate attributeName="fill-opacity" begin="4.7s" dur="0.4s" fill="freeze" from="0" to="1"/></tspan>
  </text>
</svg>
